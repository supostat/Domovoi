[package]
name = "domovoi-scanner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
dispatch2 = { workspace = true, features = ["objc2"] }
domovoi-apfs-sys.workspace = true
libc.workspace = true
objc2-core-foundation = { workspace = true, features = ["CFArray", "CFString", "CFUUID"] }
objc2-core-services = { workspace = true, features = ["FSEvents", "dispatch2", "libc"] }
rayon.workspace = true

[dev-dependencies]
domovoi-testkit.workspace = true

[[bench]]
name = "full_scan"
harness = false
