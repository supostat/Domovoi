[package]
name = "domovoi-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bytemuck.workspace = true
domovoi-index.workspace = true
domovoi-theme.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = [
  "NSAccessibility",
  "NSAccessibilityConstants",
  "NSAccessibilityElement",
  "NSAccessibilityProtocols",
  "NSBezierPath",
  "NSBitmapImageRep",
  "NSColor",
  "NSColorSpace",
  "NSEvent",
  "NSGraphicsContext",
  "NSGraphics",
  "NSImageRep",
  "NSResponder",
  "NSTrackingArea",
  "NSWindow",
  "NSView",
  "objc2-core-foundation",
  "objc2-core-graphics",
  "objc2-quartz-core",
] }
objc2-core-foundation = { workspace = true, features = ["CFArray", "CFAttributedString", "CFCGTypes", "CFData", "CFDictionary", "CFError", "CFNumber", "CFString", "CFURL"] }
objc2-core-graphics = { workspace = true, features = ["CGBitmapContext", "CGColor", "CGColorSpace", "CGContext", "CGFont", "CGImage"] }
objc2-core-text = { workspace = true, features = ["CTFont", "CTFontDescriptor", "CTFontManager", "CTLine", "CTRun", "CTStringAttributes", "objc2-core-graphics"] }
objc2-foundation = { workspace = true, features = ["NSArray", "NSData", "NSError", "NSGeometry", "NSString", "NSURL"] }
objc2-metal = { workspace = true, features = [
  "MTLBlitCommandEncoder",
  "MTLBuffer",
  "MTLCommandBuffer",
  "MTLCommandEncoder",
  "MTLCommandQueue",
  "MTLDevice",
  "MTLLibrary",
  "MTLPixelFormat",
  "MTLRenderCommandEncoder",
  "MTLRenderPass",
  "MTLRenderPipeline",
  "MTLResource",
  "MTLTexture",
  "MTLTypes",
  "objc2-core-foundation",
] }
objc2-metal-kit = { workspace = true, features = ["MTKView", "objc2-app-kit", "objc2-core-foundation", "objc2-core-graphics", "objc2-quartz-core"] }
objc2-quartz-core = { workspace = true, features = ["CAMetalLayer", "objc2-metal"] }

[dev-dependencies]
domovoi-scanner.workspace = true
domovoi-testkit.workspace = true
serde_json.workspace = true

[[test]]
name = "color_parity"
harness = false

[[test]]
name = "accessibility"
harness = false

[[bench]]
name = "frame"
harness = false
