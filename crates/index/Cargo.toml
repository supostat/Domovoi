[package]
name = "domovoi-index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
block2.workspace = true
dispatch2.workspace = true
domovoi-apfs-sys.workspace = true
domovoi-scanner.workspace = true
libc.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSWorkspace"] }
objc2-core-foundation = { workspace = true, features = ["CFArray", "CFDate", "CFDictionary", "CFError", "CFString", "CFURL"] }
objc2-core-services = { workspace = true, features = ["MDItem", "MDQuery", "Metadata"] }
objc2-foundation = { workspace = true, features = ["NSArray", "NSData", "NSDictionary", "NSEnumerator", "NSError", "NSPropertyList", "NSString", "NSURL", "NSValue"] }
objc2-security = { workspace = true, features = ["CSCommon", "SecBase", "SecCode", "SecStaticCode"] }
objc2-uniform-type-identifiers = { workspace = true, features = ["UTType", "UTCoreTypes"] }
rkyv.workspace = true

[dev-dependencies]
domovoi-testkit.workspace = true
