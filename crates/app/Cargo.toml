[package]
name = "domovoi-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "domovoi"
path = "src/main.rs"

[features]
claude-code = ["domovoi-agent/claude-code"]

[dependencies]
block2.workspace = true
domovoi-agent.workspace = true
domovoi-apfs-sys.workspace = true
domovoi-downloader.workspace = true
domovoi-dups.workspace = true
domovoi-grammar.workspace = true
domovoi-index.workspace = true
domovoi-inference.workspace = true
domovoi-inference-proto.workspace = true
domovoi-log-sys.workspace = true
domovoi-render.workspace = true
domovoi-rules.workspace = true
domovoi-scanner.workspace = true
domovoi-theme.workspace = true
domovoi-xpc-sys.workspace = true
libc.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = [
  "NSAccessibility",
  "NSAlert",
  "NSAccessibilityProtocols",
  "NSAppearance",
  "NSApplication",
  "NSAttributedString",
  "NSBezierPath",
  "NSButton",
  "NSButtonCell",
  "NSCell",
  "NSClipView",
  "NSCollectionView",
  "NSCollectionViewFlowLayout",
  "NSCollectionViewLayout",
  "NSColor",
  "NSColorSpace",
  "NSControl",
  "NSEvent",
  "NSFont",
  "NSFontDescriptor",
  "NSGraphics",
  "NSGraphicsContext",
  "NSGridView",
  "NSImage",
  "NSImageRep",
  "NSLayoutAnchor",
  "NSLayoutConstraint",
  "NSMenu",
  "NSMenuItem",
  "NSOpenPanel",
  "NSOutlineView",
  "NSPanel",
  "NSParagraphStyle",
  "NSResponder",
  "NSRunningApplication",
  "NSSavePanel",
  "NSScreen",
  "NSScrollView",
  "NSScroller",
  "NSSegmentedControl",
  "NSSplitView",
  "NSSplitViewController",
  "NSSplitViewItem",
  "NSStackView",
  "NSStringDrawing",
  "NSTableCellView",
  "NSTableColumn",
  "NSTableHeaderView",
  "NSTableView",
  "NSText",
  "NSTextContainer",
  "NSTextField",
  "NSTextView",
  "NSUserInterfaceLayout",
  "NSView",
  "NSViewController",
  "NSWindow",
  "NSWorkspace",
  "block2",
  "objc2-core-foundation",
  "objc2-core-graphics",
] }
objc2-core-foundation = { workspace = true, features = ["CFCGTypes"] }
objc2-core-graphics = { workspace = true, features = ["CGBitmapContext", "CGColor", "CGColorSpace", "CGContext", "CGImage", "CGPath"] }
objc2-foundation = { workspace = true, features = ["NSArray", "NSAttributedString", "NSBundle", "NSDate", "NSDictionary", "NSError", "NSGeometry", "NSIndexPath", "NSNotification", "NSObject", "NSOperation", "NSProcessInfo", "NSRange", "NSRunLoop", "NSString", "NSTimer", "NSURL", "NSUserDefaults", "NSValue", "block2"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
domovoi-testkit.workspace = true
domovoi-xpc-sys = { workspace = true, features = ["adhoc"] }

[[test]]
name = "truncation"
harness = false

[[test]]
name = "cards_layout"
harness = false

[[test]]
name = "sidebar_rescan"
harness = false

[[test]]
name = "screen_update"
harness = false

[[test]]
name = "smoke_inference_client"
harness = false

[[test]]
name = "claude_code"
required-features = ["claude-code"]
