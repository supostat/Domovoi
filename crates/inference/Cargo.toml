[package]
name = "domovoi-inference"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "domovoi-inference"
path = "src/main.rs"

[dependencies]
dispatch2.workspace = true
domovoi-apfs-sys.workspace = true
domovoi-inference-proto.workspace = true
domovoi-llama-sys.workspace = true
domovoi-xpc-sys.workspace = true
libc.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSBundle", "NSString"] }
objc2-metal = { workspace = true, features = ["MTLDevice"] }

[dev-dependencies]
domovoi-grammar.workspace = true
domovoi-index.workspace = true
domovoi-scanner.workspace = true
domovoi-testkit.workspace = true
domovoi-xpc-sys = { workspace = true, features = ["adhoc"] }
serde_json.workspace = true
